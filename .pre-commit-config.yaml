default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push]

repos:
  # Secret detection with gitleaks. The commit-stage hook scans staged changes
  # (skippable with --no-verify); the pre-push stage re-scans the commits being
  # pushed. CI (secret-scan.yml) is the non-bypassable backstop.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
      # Covers the first ref of a multi-ref push only (pre-commit exposes a
      # single from/to pair); the CI push scan covers every ref.
      # A root-commit push (new branch with no common history) sets neither
      # PRE_COMMIT_FROM_REF nor PRE_COMMIT_TO_REF; without the fallback to the
      # pushed local ref the range is empty and nothing is scanned, yet the hook
      # reports Passed.
      - id: gitleaks
        alias: gitleaks-push
        name: Detect hardcoded secrets (pushed commits)
        entry: >-
          bash -c 'gitleaks git --redact --no-banner --verbose
          --log-opts="--diff-merges=first-parent
          ${PRE_COMMIT_FROM_REF:+${PRE_COMMIT_FROM_REF}..}${PRE_COMMIT_TO_REF:-${PRE_COMMIT_LOCAL_BRANCH:-HEAD}}"'
        stages: [pre-push]
        # Scan even when the pushed range's net diff touches no files: a
        # secret added then deleted within the range is still in history.
        always_run: true
