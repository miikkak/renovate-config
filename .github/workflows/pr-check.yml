---
name: PR Check

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  pre-commit:
    uses: miikkak/workflows/.github/workflows/pr-check.yml@656f72b6ef441035024a582f9a232d4ebc74b45a # main
    with:
      # Public repo with no self-hosted runners registered: GitHub-hosted
      # minutes are free here, so run on ubuntu-slim like secret-scan does.
      runner: '["ubuntu-slim"]'
    secrets: inherit
