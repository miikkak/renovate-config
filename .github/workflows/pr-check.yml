---
name: PR Check

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  pre-commit:
    uses: miikkak/workflows/.github/workflows/pr-check.yml@a2afdedf16798a9393f7a8e383e936ca1bafc2f0 # main
    with:
      # Public repo with no self-hosted runners registered: GitHub-hosted
      # minutes are free here, so run on ubuntu-slim like secret-scan does.
      runner: '["ubuntu-slim"]'
    secrets: inherit
