---
name: PR Check

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  pre-commit:
    uses: miikkak/workflows/.github/workflows/pr-check.yml@a05438d3b5a13cecfadc58d9d7b7692c55d1bfc8 # main
    with:
      # Public repo with no self-hosted runners registered: GitHub-hosted
      # minutes are free here, so run on ubuntu-slim like secret-scan does.
      runner: '["ubuntu-slim"]'
    secrets: inherit
