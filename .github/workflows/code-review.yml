---
name: Code Review

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, ready_for_review, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    uses: miikkak/workflows/.github/workflows/code-review.yml@a2afdedf16798a9393f7a8e383e936ca1bafc2f0 # main
    with:
      enabled: true
      # Public repo with no self-hosted runners registered: GitHub-hosted
      # minutes are free here, so run on ubuntu-slim like secret-scan does.
      runner: '["ubuntu-slim"]'
    secrets: inherit
